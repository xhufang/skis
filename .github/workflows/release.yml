name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version without the v prefix (for example, 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Stage Maven Central and draft GitHub release
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Set up Java and publishing credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate tag, version, and changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x mvnw
          project_version="$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${project_version}" == *-SNAPSHOT ]]; then
            echo "Release POM version must not be a SNAPSHOT: ${project_version}"
            exit 1
          fi
          if [[ "${project_version}" != "${tag_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match POM version ${project_version}"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "${RELEASE_TAG}")" ]]; then
            echo "Checked-out revision does not match tag ${RELEASE_TAG}"
            exit 1
          fi
          grep -Fq "## [${project_version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${project_version}"
            exit 1
          }

      - name: Validate release plugin inheritance
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -pl skis-bom -Prelease help:effective-pom -Doutput="${RUNNER_TEMP}/skis-bom-effective-pom.xml"
          grep -Fq "<artifactId>central-publishing-maven-plugin</artifactId>" "${RUNNER_TEMP}/skis-bom-effective-pom.xml"
          ./mvnw -B -ntp -pl skis-test-model -Prelease help:effective-pom -Doutput="${RUNNER_TEMP}/skis-test-model-effective-pom.xml"
          python - "${RUNNER_TEMP}/skis-test-model-effective-pom.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse(sys.argv[1]).getroot()
          plugins = {
              plugin.findtext("m:artifactId", namespaces=namespace): plugin
              for plugin in root.findall("m:build/m:plugins/m:plugin", namespace)
          }
          expected = {
              "maven-source-plugin": ("skipSource", "true"),
              "maven-javadoc-plugin": ("skip", "true"),
              "maven-gpg-plugin": ("skip", "true"),
          }
          for artifact_id, (parameter, value) in expected.items():
              plugin = plugins.get(artifact_id)
              actual = None if plugin is None else plugin.findtext(
                  f"m:configuration/m:{parameter}", namespaces=namespace
              )
              if actual != value:
                  raise SystemExit(
                      f"{artifact_id} must configure {parameter}={value} for skis-test-model; got {actual!r}"
                  )
          PY

      - name: Validate release boundary metadata
        shell: pwsh
        run: ./.github/scripts/verify-release-boundary.ps1

      - name: Verify, sign, and stage
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Pcompliance,release deploy

      - name: Validate Central component GAV set
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          bundle="$(find target/central-publishing -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [[ -z "${bundle}" ]]; then
            echo "Central bundle was not created"
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          awk -v version="${release_version}" 'NF { print "io.github.xhufang:" $0 ":" version }' \
            .github/release-components.txt | sort -u > "${RUNNER_TEMP}/expected-components.txt"
          unzip -Z1 "${bundle}" | \
            awk -F/ '$1 == "io" && $2 == "github" && $3 == "xhufang" && NF >= 6 { print "io.github.xhufang:" $4 ":" $5 }' | \
            sort -u > "${RUNNER_TEMP}/actual-components.txt"
          diff -u "${RUNNER_TEMP}/expected-components.txt" "${RUNNER_TEMP}/actual-components.txt"

      - name: Create or update draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find target/central-publishing target/sbom -type f \( -name '*.zip' -o -name '*.json' -o -name '*.xml' \) 2>/dev/null | sort)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if (( ${#assets[@]} > 0 )); then
              gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            fi
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "SKIS ${RELEASE_TAG#v}"
          fi
