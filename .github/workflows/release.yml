name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version without the v prefix (for example, 0.0.4)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central and GitHub
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref }}

      - name: Set up Java and publishing credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate tag, version, and changelog
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x mvnw
          project_version="$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          tag_version="${RELEASE_TAG#v}"
          if [[ "${project_version}" == *-SNAPSHOT ]]; then
            echo "Release POM version must not be a SNAPSHOT: ${project_version}"
            exit 1
          fi
          if [[ "${project_version}" != "${tag_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match POM version ${project_version}"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-list -n 1 "${RELEASE_TAG}")" ]]; then
            echo "Checked-out revision does not match tag ${RELEASE_TAG}"
            exit 1
          fi
          grep -Fq "## [${project_version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${project_version}"
            exit 1
          }

      - name: Verify, sign, and publish
        shell: bash
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B -ntp -Pcompliance,release deploy

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find target/central-publishing target/sbom -type f \( -name '*.zip' -o -name '*.json' -o -name '*.xml' \) 2>/dev/null | sort)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            if (( ${#assets[@]} > 0 )); then
              gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
            fi
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "SKIS ${RELEASE_TAG#v}"
          fi
