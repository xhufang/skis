name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-boundary:
    name: Release boundary metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify BOM, deploy skips, and Central allowlist
        shell: pwsh
        run: ./.github/scripts/verify-release-boundary.ps1

  unit-tests:
    name: Unit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify reactor
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

      - name: Upload failing test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-java-${{ matrix.java }}
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore

  integration-tests:
    name: Integration test module
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skis
          POSTGRES_USER: skis
          POSTGRES_PASSWORD: skis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skis -d skis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SKIS_POSTGRES_URL: jdbc:postgresql://localhost:5432/skis
      SKIS_POSTGRES_USER: skis
      SKIS_POSTGRES_PASSWORD: skis
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify integration tests and dependencies
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl skis-integration-tests -am verify

      - name: Upload failing integration reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  minimal-consumer:
    name: Independent H2 consumer
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install only the consumer dependency closure
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dmaven.test.skip=true \
            -pl skis-bom,skis-runtime,skis-dialect-h2,skis-processor \
            -am install

      - name: Verify a project with no SKIS parent or reactor membership
        shell: bash
        run: |
          project_version="$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          consumer_dir="${RUNNER_TEMP}/skis-minimal-h2-consumer"
          cp -R skis-integration-tests/src/consumer/minimal-h2 "${consumer_dir}"
          ./mvnw -B -ntp \
            -f "${consumer_dir}/pom.xml" \
            -Dskis.version="${project_version}" \
            verify
