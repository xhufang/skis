name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      coverage_baseline_commit:
        description: Current default-branch tip SHA for the coverage comparison (older commits are rejected)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-gates:
    name: Engineering gates (Java 21 coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out complete comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up authoritative Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up coverage tooling Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prove coverage ratchet failure cases
        shell: bash
        run: python -m unittest discover -s .github/scripts/tests -p test_branch_coverage.py -v

      - name: Prove test report gate rejects incomplete and failed evidence
        shell: pwsh
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP/report-gate-contracts.txt"
          ./.github/scripts/tests/test-test-reports.ps1
          Stop-Transcript

      - name: Register clean build and trusted comparison
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.coverage_baseline_commit }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) comparison="$PR_BASE" ;;
            push) comparison="$PUSH_BEFORE" ;;
            workflow_dispatch) comparison="$MANUAL_BASE" ;;
            *) exit 1 ;;
          esac
          python .github/scripts/branch_coverage.py start \
            --session "$RUNNER_TEMP/skis-coverage-session.json" --comparison "$comparison"

      - name: Compile once and execute unit APT H2 and real PostgreSQL contracts
        shell: bash
        run: |
          set -euo pipefail
          bash ./mvnw --version | tee "$RUNNER_TEMP/coverage-environment.txt"
          # Keep the runtime java.version intact for Enforcer's JDK update-level check.
          bash ./mvnw -B -ntp clean verify -Pstatic-analysis,coverage,architecture,postgres-contracts \
            -Dmaven.compiler.release=21 -Dskis.coverage.commit="$GITHUB_SHA" \
            2>&1 | tee "$RUNNER_TEMP/coverage-build.log"

      - name: Require real PG and critical failure contracts without skips
        shell: pwsh
        run: |
          ./.github/scripts/verify-postgres-selection.ps1 -UnitReports
          ./.github/scripts/verify-postgres-reports.ps1 -ExpectedSource testcontainers
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-integration-tests/target/surefire-reports `
            -RequiredSuites io.skis.architecture.ArchitectureContractTest
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-core/target/surefire-reports `
            -RequiredSuites @('io.skis.core.internal.ExecutionListenerDispatcherTest', 'io.skis.core.internal.SqlLoggingTest')
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-jdbc/target/surefire-reports `
            -RequiredSuites @('io.skis.jdbc.JdbcExecutorTest', 'io.skis.jdbc.JdbcFailureContractTest', 'io.skis.jdbc.internal.ParameterLoggingTest')
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-query/target/surefire-reports `
            -RequiredSuites @('io.skis.query.internal.ProjectionPlanCacheTest', 'io.skis.query.internal.EntityPlanSetTest', 'io.skis.query.internal.QueryPaginationCompilationTest', 'io.skis.query.internal.CachedQueryPlanRetentionTest')
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-dialect-support/target/surefire-reports `
            -RequiredSuites io.skis.dialect.support.CompilationPipelineTest

      - name: Require executed nullness and nominal type contracts
        shell: pwsh
        run: |
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-processor/target/surefire-reports `
            -RequiredSuites @('io.skis.processor.NullnessCompilationTest', 'io.skis.processor.SkisEntityProcessorTest')
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-query/target/surefire-reports `
            -RequiredSuites io.skis.query.internal.QueryTypeSafetyCompilationTest
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-mutation/target/surefire-reports `
            -RequiredSuites io.skis.mutation.MutationTypeSafetyCompilationTest

      - name: Prove Enforcer dependency failures and test-scope allowance
        shell: pwsh
        run: ./.github/scripts/verify-architecture-enforcer.ps1

      - name: Require complete current regression suites
        shell: pwsh
        run: |
          ./.github/scripts/verify-regression-reports.ps1 `
            -ReportPath "$env:RUNNER_TEMP/regression-java-21.json"

      - name: Collect module coverage and candidate
        shell: bash
        run: |
          python .github/scripts/branch_coverage.py collect \
            --session "$RUNNER_TEMP/skis-coverage-session.json" --output "$RUNNER_TEMP/skis-coverage"
          cat "$RUNNER_TEMP/skis-coverage/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload authoritative coverage evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branch-coverage-java-21-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skis-coverage/
          if-no-files-found: error
          retention-days: 90

      - name: Check branch ratchet against trusted history and report provenance
        shell: bash
        run: python .github/scripts/branch_coverage.py check --output "$RUNNER_TEMP/skis-coverage"

      - name: Upload build test and raw fork evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engineering-gates-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/jacoco/*.exec
            skis-processor/target/nullness-reports/**
            .github/quality/*.json
            ${{ runner.temp }}/skis-enforcer-evidence/**
            ${{ runner.temp }}/skis-coverage-session.json
            ${{ runner.temp }}/coverage-environment.txt
            ${{ runner.temp }}/coverage-build.log
            ${{ runner.temp }}/report-gate-contracts.txt
            ${{ runner.temp }}/regression-java-21.json
          if-no-files-found: error

      - name: Require container cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -aq --filter label=io.skis.postgres-contract=true)"
          test -z "$remaining"

  release-boundary:
    name: Release boundary metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify BOM, deploy skips, and Central allowlist
        shell: pwsh
        run: ./.github/scripts/verify-release-boundary.ps1

      - name: Set up Java 21 for source contract checks
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify current public contracts and independent consumer boundaries
        shell: pwsh
        run: ./.github/scripts/verify-current-contracts.ps1

  # Preserve existing required-check names without rebuilding Java 21 or rerunning PG.
  # Run these checks even when the shared job failed or was skipped, then fail explicitly.
  unit-tests-java-21:
    name: Unit tests (Java 21)
    needs: engineering-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful consolidated Java 21 gates
        shell: bash
        env:
          ENGINEERING_GATES_RESULT: ${{ needs.engineering-gates.result }}
        run: test "$ENGINEERING_GATES_RESULT" = success

  unit-tests:
    name: Unit tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "25" ]
    env:
      # Ordinary tests must ignore PG configuration and never discover Docker.
      SKIS_POSTGRES_URL: intentionally-invalid-for-unit-selection
      DOCKER_HOST: tcp://127.0.0.1:1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify reactor and nullness contracts
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --version | tee "${RUNNER_TEMP}/static-analysis-environment.txt"
          bash ./mvnw -B -ntp clean verify -Pstatic-analysis,architecture 2>&1 \
            | tee "${RUNNER_TEMP}/static-analysis-build.log"

      - name: Prove test report gate rejects incomplete and failed evidence
        shell: pwsh
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP/report-gate-contracts.txt"
          ./.github/scripts/tests/test-test-reports.ps1
          Stop-Transcript

      - name: Require complete current regression suites
        shell: pwsh
        run: |
          ./.github/scripts/verify-regression-reports.ps1 `
            -ReportPath "$env:RUNNER_TEMP/regression-java-${{ matrix.java }}.json"

      - name: Prove Enforcer dependency failures and test-scope allowance
        shell: pwsh
        run: ./.github/scripts/verify-architecture-enforcer.ps1

      - name: Require executed architecture rules and GC contracts
        shell: pwsh
        run: |
          ./.github/scripts/verify-postgres-selection.ps1 -UnitReports
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-integration-tests/target/surefire-reports `
            -RequiredSuites io.skis.architecture.ArchitectureContractTest
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-query/target/surefire-reports `
            -RequiredSuites io.skis.query.internal.CachedQueryPlanRetentionTest

      - name: Require executed nullness and nominal type contracts
        shell: pwsh
        run: |
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-processor/target/surefire-reports `
            -RequiredSuites @('io.skis.processor.NullnessCompilationTest', 'io.skis.processor.SkisEntityProcessorTest')
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-query/target/surefire-reports `
            -RequiredSuites io.skis.query.internal.QueryTypeSafetyCompilationTest
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory skis-mutation/target/surefire-reports `
            -RequiredSuites io.skis.mutation.MutationTypeSafetyCompilationTest

      - name: Upload static analysis and test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports-java-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            skis-processor/target/nullness-reports/**
            ${{ runner.temp }}/static-analysis-environment.txt
            ${{ runner.temp }}/static-analysis-build.log
            ${{ runner.temp }}/report-gate-contracts.txt
            ${{ runner.temp }}/regression-java-${{ matrix.java }}.json
            ${{ runner.temp }}/skis-enforcer-evidence/**
            .github/quality/*.json
          if-no-files-found: error

  integration-tests:
    name: Integration test module
    needs: engineering-gates
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful consolidated PostgreSQL contracts
        shell: bash
        env:
          ENGINEERING_GATES_RESULT: ${{ needs.engineering-gates.result }}
        run: test "$ENGINEERING_GATES_RESULT" = success

  minimal-consumer:
    name: Independent public consumers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install only the consumer dependency closure
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dmaven.test.skip=true \
            -pl skis-bom,skis-runtime,skis-dialect-h2,skis-processor \
            -am install

      - name: Verify a project with no SKIS parent or reactor membership
        shell: bash
        run: |
          project_version="$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          consumer_dir="${RUNNER_TEMP}/skis-spi-only-consumer"
          cp -R skis-integration-tests/src/consumer/spi-only "${consumer_dir}"
          ./mvnw -B -ntp \
            -f "${consumer_dir}/pom.xml" \
            -Dskis.version="${project_version}" \
            verify
          java .github/scripts/VerifyExternalBytecode.java "${consumer_dir}/target/test-classes"

          consumer_dir="${RUNNER_TEMP}/skis-listener-only-consumer"
          cp -R skis-integration-tests/src/consumer/listener-only "${consumer_dir}"
          ./mvnw -B -ntp \
            -f "${consumer_dir}/pom.xml" \
            -Dskis.version="${project_version}" \
            verify
          java .github/scripts/VerifyExternalBytecode.java "${consumer_dir}/target/test-classes"

          consumer_dir="${RUNNER_TEMP}/skis-minimal-h2-consumer"
          cp -R skis-integration-tests/src/consumer/minimal-h2 "${consumer_dir}"
          ./mvnw -B -ntp \
            -f "${consumer_dir}/pom.xml" \
            -Dskis.version="${project_version}" \
            verify
          java .github/scripts/VerifyExternalBytecode.java \
            "${consumer_dir}/target/classes" "${consumer_dir}/target/test-classes"

      - name: Require independent consumer contracts without skipped tests
        shell: pwsh
        run: |
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory "$env:RUNNER_TEMP/skis-spi-only-consumer/target/surefire-reports" `
            -RequiredSuites example.DialectSpiOnlyConsumerTest
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory "$env:RUNNER_TEMP/skis-listener-only-consumer/target/surefire-reports" `
            -RequiredSuites example.ListenerSpiOnlyConsumerTest
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory "$env:RUNNER_TEMP/skis-minimal-h2-consumer/target/surefire-reports" `
            -RequiredSuites @('example.MinimalConsumerTest', 'example.SupportedSpiConsumerTest', 'example.ExecutionListenerConsumerTest', 'example.SqlLoggingConsumerTest', 'example.GeneratedIdConsumerTest')

      - name: Upload independent consumer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-consumer-reports
          path: |
            ${{ runner.temp }}/skis-spi-only-consumer/target/surefire-reports/**
            ${{ runner.temp }}/skis-listener-only-consumer/target/surefire-reports/**
            ${{ runner.temp }}/skis-minimal-h2-consumer/target/surefire-reports/**
          if-no-files-found: error

  postgresql-consumer:
    name: Independent PostgreSQL consumer (${{ matrix.source }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [testcontainers, external-url]
    services:
      postgres:
        image: ${{ matrix.source == 'external-url' && 'postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0' || '' }}
        env:
          POSTGRES_DB: skis
          POSTGRES_USER: skis
          POSTGRES_PASSWORD: skis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skis -d skis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install only the PostgreSQL consumer dependency closure
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dmaven.test.skip=true \
            -pl skis-bom,skis-runtime,skis-dialect-postgresql,skis-processor,skis-test-support \
            -am install
          bash ./mvnw -B -ntp -pl skis-test-support \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
            -DincludeScope=runtime -DoutputDirectory=target/consumer-launcher/lib

      - name: Prove explicit URL and missing Docker failures
        shell: pwsh
        run: |
          ./.github/scripts/verify-postgres-failures.ps1 `
            -Classpath 'skis-test-support/target/classes:skis-test-support/target/consumer-launcher/lib/*'

      - name: Configure explicit service URL
        if: matrix.source == 'external-url'
        shell: bash
        run: |
          echo 'SKIS_POSTGRES_URL=jdbc:postgresql://localhost:5432/skis' >> "$GITHUB_ENV"
          echo 'SKIS_POSTGRES_USER=skis' >> "$GITHUB_ENV"
          echo 'SKIS_POSTGRES_PASSWORD=skis' >> "$GITHUB_ENV"

      - name: Verify PostgreSQL outside the repository reactor
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          consumer_dir="${RUNNER_TEMP}/skis-minimal-postgresql-consumer"
          cp -R skis-integration-tests/src/consumer/minimal-postgresql "${consumer_dir}"
          java -cp 'skis-test-support/target/classes:skis-test-support/target/consumer-launcher/lib/*' \
            io.skis.testsupport.PostgresConsumerLauncher -- \
            bash ./mvnw -B -ntp -f "${consumer_dir}/pom.xml" \
            -Dskis.version="${project_version}" verify \
            2>&1 | tee "$RUNNER_TEMP/postgresql-consumer-launcher.log"
          java .github/scripts/VerifyExternalBytecode.java \
            "${consumer_dir}/target/classes" "${consumer_dir}/target/test-classes"

      - name: Prove failed consumer child still cleans its environment
        shell: pwsh
        run: |
          ./.github/scripts/verify-postgres-failures.ps1 -ChildFailure `
            -Classpath 'skis-test-support/target/classes:skis-test-support/target/consumer-launcher/lib/*'

      - name: Require the PostgreSQL consumer without skipped tests
        shell: pwsh
        run: |
          $log = Get-Content -LiteralPath "$env:RUNNER_TEMP/postgresql-consumer-launcher.log" -Raw
          if ($log -notmatch 'PostgreSQL environment: source=${{ matrix.source }},') {
            throw 'Independent consumer used the wrong database environment source'
          }
          ./.github/scripts/verify-test-reports.ps1 `
            -ReportDirectory "$env:RUNNER_TEMP/skis-minimal-postgresql-consumer/target/surefire-reports" `
            -RequiredSuites @('example.PostgreSqlConsumerTest', 'example.GeneratedIdConsumerTest')

      - name: Upload PostgreSQL consumer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgresql-consumer-reports-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/skis-minimal-postgresql-consumer/target/surefire-reports/**
            ${{ runner.temp }}/postgresql-consumer-launcher.log
            .github/quality/postgresql-image.json
          if-no-files-found: error

      - name: Require container cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -aq --filter label=io.skis.postgres-contract=true)"
          test -z "$remaining"

  postgresql-contracts:
    name: PostgreSQL contracts (${{ matrix.source }}, Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: testcontainers
            java: "25"
          - source: external-url
            java: "21"
    services:
      postgres:
        image: ${{ matrix.source == 'external-url' && 'postgres:16.15-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0' || '' }}
        env:
          POSTGRES_DB: skis
          POSTGRES_USER: skis
          POSTGRES_PASSWORD: skis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skis -d skis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Configure explicit service URL
        if: matrix.source == 'external-url'
        shell: bash
        run: |
          echo 'SKIS_POSTGRES_URL=jdbc:postgresql://localhost:5432/skis' >> "$GITHUB_ENV"
          echo 'SKIS_POSTGRES_USER=skis' >> "$GITHUB_ENV"
          echo 'SKIS_POSTGRES_PASSWORD=skis' >> "$GITHUB_ENV"

      - name: Execute the same PostgreSQL contracts on the selected environment
        shell: bash
        run: bash ./mvnw -B -ntp clean verify -Ppostgres-contracts

      - name: Require PG and retained H2 suites without skips
        shell: pwsh
        run: |
          ./.github/scripts/verify-postgres-selection.ps1 -UnitReports
          ./.github/scripts/verify-postgres-reports.ps1 -ExpectedSource '${{ matrix.source }}'

      - name: Upload PostgreSQL contract reports and image identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgresql-contracts-${{ matrix.source }}-java-${{ matrix.java }}
          path: |
            **/target/failsafe-reports/**
            .github/quality/postgresql-image.json
            .github/quality/postgresql-suites.json
          if-no-files-found: error

      - name: Require container cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          remaining="$(docker ps -aq --filter label=io.skis.postgres-contract=true)"
          test -z "$remaining"

  gradle-incremental-processor:
    name: Gradle incremental projection processor
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Install the Gradle consumer dependency closure
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dmaven.test.skip=true \
            -pl skis-runtime,skis-processor \
            -am install

      - name: Verify cross-entity incremental invalidation
        shell: bash
        run: |
          project_version="$(./mvnw -q -N help:evaluate -Dexpression=project.version -DforceStdout)"
          chmod +x .github/scripts/verify-gradle-projection-incremental.sh
          ./.github/scripts/verify-gradle-projection-incremental.sh "${project_version}"
