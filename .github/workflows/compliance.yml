name: Compliance

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      architecture_baseline_commit:
        description: Current default-branch tip SHA for architecture history (must already contain registration)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adr-consistency:
    name: ADR registration and implementation anchors
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete architecture comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up architecture inspection Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install source inspection tooling
        id: architecture_tools
        run: python -m pip install -r .github/architecture/requirements.txt

      - name: Prove architecture gate failure cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/architecture"
          python .github/scripts/run_architecture_contracts.py \
            2>&1 | tee "$RUNNER_TEMP/architecture/failure-contracts.txt"

      - name: Verify registered decisions against trusted history
        if: ${{ !cancelled() && steps.architecture_tools.outcome == 'success' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MANUAL_BASE: ${{ inputs.architecture_baseline_commit }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) comparison="$PR_BASE" ;;
            push) comparison="$PUSH_BEFORE" ;;
            workflow_dispatch) comparison="$MANUAL_BASE" ;;
            *) exit 1 ;;
          esac
          python .github/scripts/architecture_decisions.py ci --baseline "$comparison" \
            --report "$RUNNER_TEMP/architecture/ci.json"

      - name: Upload architecture check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: architecture-decisions-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/architecture/
          if-no-files-found: error

  benchmark-freeze:
    name: 0.2.x benchmark freeze
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enforce the 0.2.x benchmark freeze
        shell: bash
        run: |
          set -euo pipefail

          test -f skis-benchmark/pom.xml

          unexpected_files="$(find skis-benchmark -type f ! -path 'skis-benchmark/pom.xml' -print)"
          if [[ -n "${unexpected_files}" ]]; then
            echo "Benchmark files are forbidden during 0.2.x development:"
            echo "${unexpected_files}"
            exit 1
          fi

          if [[ -e docs/benchmark ]]; then
            echo "docs/benchmark must remain absent during 0.2.x development"
            exit 1
          fi

          unexpected_named_assets="$(find . -path './.git' -prune -o -type f \
            \( -iname '*benchmark*' -o -iname '*jmh*' -o -iname '*fast-path-smoke*' -o -iname '*performance-smoke*' \) \
            ! -path './skis-benchmark/pom.xml' -print)"
          if [[ -n "${unexpected_named_assets}" ]]; then
            echo "Benchmark assets are forbidden during 0.2.x development:"
            echo "${unexpected_named_assets}"
            exit 1
          fi

          if grep -Eq '<(modules|dependencies|dependencyManagement|profiles|build)([[:space:]]|>)' skis-benchmark/pom.xml; then
            echo "skis-benchmark/pom.xml must remain an empty aggregator during 0.2.x development"
            exit 1
          fi

          if find . -name pom.xml -not -path './.git/*' -print0 \
              | xargs -0 grep -Eq 'org\.openjdk\.jmh|<artifactId>jmh-'; then
            echo "JMH dependencies are forbidden during 0.2.x development"
            exit 1
          fi

          unexpected_workflows="$(find .github/workflows -maxdepth 1 -type f \( -iname '*benchmark*' -o -iname '*performance-smoke*' -o -iname '*fast-path-smoke*' \) -print)"
          if [[ -n "${unexpected_workflows}" ]]; then
            echo "Benchmark execution workflows are forbidden during 0.2.x development:"
            echo "${unexpected_workflows}"
            exit 1
          fi

          if find .github/workflows -maxdepth 1 -type f ! -name compliance.yml -print0 \
              | xargs -0 grep -Eiq 'org\.openjdk\.jmh|jmh-core|benchmark-runner|compare-fast-path|docs/benchmark|mvn[^[:cntrl:]]*skis-benchmark'; then
            echo "A benchmark execution entry remains in a workflow during 0.2.x development"
            exit 1
          fi

  dependency-review:
    name: Dependency vulnerability review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  licenses-and-sbom:
    name: Licenses and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          for file in LICENSE NOTICE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md CHANGELOG.md; do
            test -s "${file}" || {
              echo "Required project file is missing or empty: ${file}"
              exit 1
            }
          done
          grep -Fq '<name>Apache License, Version 2.0</name>' pom.xml
          grep -Fq '<url>https://github.com/xhufang/skis</url>' pom.xml

      - name: Check dependency licenses and generate SBOM
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests -Pcompliance verify

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compliance-artifacts
          path: |
            **/target/generated-resources/licenses/THIRD-PARTY.txt
            target/sbom/*.json
            target/sbom/*.xml
          if-no-files-found: error
