name: Fast Path Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "pom.xml"
      - "skis-annotations/**"
      - "skis-core/**"
      - "skis-metadata/**"
      - "skis-processor/**"
      - "skis-sql-ast/**"
      - "skis-dialect-api/**"
      - "skis-dialect-postgresql/**"
      - "skis-mapping/**"
      - "skis-jdbc/**"
      - "skis-query/**"
      - "skis-mutation/**"
      - "skis-runtime/**"
      - "skis-benchmark/**"
      - "docs/benchmark/find-by-id-all-gc-20260828.json"
      - ".github/workflows/fast-path-smoke.yml"

permissions:
  contents: read

concurrency:
  group: fast-path-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-find-by-id:
    name: PostgreSQL findById smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skis
          POSTGRES_USER: skis
          POSTGRES_PASSWORD: skis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skis -d skis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: skis
      SKIS_BENCHMARK_JDBC_URL: jdbc:postgresql://localhost:5432/skis?currentSchema=skis&stringtype=unspecified
      SKIS_BENCHMARK_DB_USERNAME: skis
      SKIS_BENCHMARK_DB_PASSWORD: skis
      SKIS_BENCHMARK_POOL_SIZE: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Create benchmark schema and row
        shell: bash
        run: |
          psql -h localhost -U skis -d skis -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA skis;
          CREATE TABLE skis.skis_user (
            id BIGINT PRIMARY KEY,
            username VARCHAR(200) NOT NULL,
            password VARCHAR(200) NOT NULL,
            create_stamp TIMESTAMP WITH TIME ZONE NOT NULL,
            modify_stamp TIMESTAMP WITH TIME ZONE NOT NULL,
            sex VARCHAR(32),
            birthday TIMESTAMP WITH TIME ZONE,
            deleted BOOLEAN NOT NULL,
            version BIGINT NOT NULL
          );
          INSERT INTO skis.skis_user
            (id, username, password, create_stamp, modify_stamp, sex, birthday, deleted, version)
          VALUES
            (888, 'benchmark', 'redacted', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP,
             'U', CURRENT_TIMESTAMP, FALSE, 0);
          SQL

      - name: Build benchmark runner
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -pl skis-benchmark/skis-benchmark-runner -am -DskipTests package

      - name: Run JDBC and SKIS smoke
        shell: bash
        run: |
          java -jar skis-benchmark/skis-benchmark-runner/target/benchmarks.jar \
            '.*UserFindByIdBenchmark\.(jdbc|skis)$' \
            -wi 3 -i 5 -f 1 -w 500ms -r 500ms \
            -prof gc -rf json \
            -rff skis-benchmark/skis-benchmark-runner/target/fast-path-smoke.json

      - name: Compare with the 0.1.1 reference
        shell: pwsh
        run: |
          ./skis-benchmark/compare-fast-path-smoke.ps1 `
            -BaselinePath docs/benchmark/find-by-id-all-gc-20260828.json `
            -CurrentPath skis-benchmark/skis-benchmark-runner/target/fast-path-smoke.json

      - name: Upload smoke result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-path-smoke
          path: skis-benchmark/skis-benchmark-runner/target/fast-path-smoke.json
          if-no-files-found: error
